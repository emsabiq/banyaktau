name: BanyakTau Publish Carousel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Carousel target: all, instagram, facebook, tiktok, or comma list
        required: false
        default: all
      item_id:
        description: Optional item id. Empty uses latest item.
        required: false
        default: ""
      force:
        description: Bypass daily carousel limit
        required: false
        default: "false"
      regenerate:
        description: Regenerate carousel images before publishing
        required: false
        default: "false"

concurrency:
  group: banyaktau-carousel
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  carousel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      UPLOAD_DRIVER: ${{ secrets.UPLOAD_DRIVER || 'auto' }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
      SFTP_UPLOAD_TIMEOUT_SECONDS: ${{ secrets.SFTP_UPLOAD_TIMEOUT_SECONDS || '180' }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      FTP_UPLOAD_TIMEOUT_SECONDS: ${{ secrets.FTP_UPLOAD_TIMEOUT_SECONDS || '180' }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      STORY_MODEL: ${{ secrets.STORY_MODEL || 'gpt-4.1-mini' }}
      IMAGE_MODEL: ${{ secrets.IMAGE_MODEL || 'gpt-image-1-mini' }}
      IMAGE_SIZE: ${{ secrets.IMAGE_SIZE || '1024x1536' }}
      IMAGE_QUALITY: ${{ secrets.IMAGE_QUALITY || 'low' }}

      BANYAKTAU_DAILY_CAROUSEL_LIMIT: ${{ secrets.BANYAKTAU_DAILY_CAROUSEL_LIMIT || '1' }}
      BANYAKTAU_TIME_ZONE: ${{ secrets.BANYAKTAU_TIME_ZONE || 'Asia/Bangkok' }}

      GRAPH_API_VERSION: ${{ secrets.GRAPH_API_VERSION || 'v25.0' }}
      FACEBOOK_UPLOAD_ENABLED: ${{ secrets.FACEBOOK_UPLOAD_ENABLED || secrets.BANYAKTAU_FACEBOOK_UPLOAD_ENABLED || 'false' }}
      FACEBOOK_PAGE_ID: ${{ secrets.BANYAKTAU_FACEBOOK_PAGE_ID || secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_FACEBOOK_PAGE_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_FACEBOOK_USER_ACCESS_TOKEN || secrets.FACEBOOK_USER_ACCESS_TOKEN }}

      INSTAGRAM_UPLOAD_ENABLED: ${{ secrets.INSTAGRAM_UPLOAD_ENABLED || secrets.BANYAKTAU_INSTAGRAM_UPLOAD_ENABLED || 'false' }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.BANYAKTAU_INSTAGRAM_IG_USER_ID || secrets.INSTAGRAM_IG_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_INSTAGRAM_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_CONTAINER_POLL_SECONDS: ${{ secrets.INSTAGRAM_CONTAINER_POLL_SECONDS || '6' }}
      INSTAGRAM_CONTAINER_MAX_ATTEMPTS: ${{ secrets.INSTAGRAM_CONTAINER_MAX_ATTEMPTS || '90' }}

      TIKTOK_UPLOAD_PAUSED: ${{ secrets.TIKTOK_UPLOAD_PAUSED || 'false' }}
      TIKTOK_UPLOAD_ENABLED: ${{ secrets.TIKTOK_UPLOAD_ENABLED || secrets.BANYAKTAU_TIKTOK_UPLOAD_ENABLED || 'false' }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
      TIKTOK_SCOPE: ${{ secrets.TIKTOK_SCOPE }}
      TIKTOK_PUBLISH_MODE: ${{ secrets.TIKTOK_PUBLISH_MODE || 'direct' }}
      TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate source
        run: npm run check

      - name: Refresh TikTok token
        if: ${{ env.TIKTOK_UPLOAD_ENABLED == 'true' && env.TIKTOK_REFRESH_TOKEN != '' && env.TIKTOK_UPLOAD_PAUSED != 'true' }}
        run: npm run tiktok:token -- --github-env

      - name: Publish carousel
        run: |
          npm run carousel:publish -- \
            --target "${{ github.event.inputs.target }}" \
            --id "${{ github.event.inputs.item_id }}" \
            --force "${{ github.event.inputs.force }}" \
            --regenerate "${{ github.event.inputs.regenerate }}"
