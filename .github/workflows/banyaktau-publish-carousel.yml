name: BanyakTau Publish Carousel

"on":
  workflow_dispatch:
    inputs:
      target:
        description: "Carousel target: all, instagram, facebook, tiktok, or comma list"
        required: false
        default: "all"
      item_id:
        description: "Optional item id. Empty uses latest item."
        required: false
        default: ""
      force:
        description: "Bypass daily carousel limit"
        required: false
        default: "false"
      regenerate:
        description: "Regenerate carousel images before publishing"
        required: false
        default: "false"
  schedule:
    - cron: "45 2 * * *"

concurrency:
  group: banyaktau-publish-carousel
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  carousel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      UPLOAD_DRIVER: ${{ secrets.UPLOAD_DRIVER }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
      SFTP_UPLOAD_TIMEOUT_SECONDS: ${{ secrets.SFTP_UPLOAD_TIMEOUT_SECONDS }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      FTP_UPLOAD_TIMEOUT_SECONDS: ${{ secrets.FTP_UPLOAD_TIMEOUT_SECONDS }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      STORY_MODEL: ${{ secrets.STORY_MODEL }}
      IMAGE_MODEL: ${{ secrets.IMAGE_MODEL }}
      IMAGE_SIZE: ${{ secrets.IMAGE_SIZE }}
      IMAGE_QUALITY: ${{ secrets.IMAGE_QUALITY }}

      BANYAKTAU_DAILY_CAROUSEL_LIMIT: ${{ secrets.BANYAKTAU_DAILY_CAROUSEL_LIMIT }}
      BANYAKTAU_TIME_ZONE: ${{ secrets.BANYAKTAU_TIME_ZONE }}

      GRAPH_API_VERSION: ${{ secrets.GRAPH_API_VERSION }}
      FACEBOOK_UPLOAD_ENABLED: ${{ secrets.FACEBOOK_UPLOAD_ENABLED }}
      BANYAKTAU_FACEBOOK_UPLOAD_ENABLED: ${{ secrets.BANYAKTAU_FACEBOOK_UPLOAD_ENABLED }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      BANYAKTAU_FACEBOOK_PAGE_ID: ${{ secrets.BANYAKTAU_FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      BANYAKTAU_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      BANYAKTAU_FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_FACEBOOK_USER_ACCESS_TOKEN }}

      INSTAGRAM_UPLOAD_ENABLED: ${{ secrets.INSTAGRAM_UPLOAD_ENABLED }}
      BANYAKTAU_INSTAGRAM_UPLOAD_ENABLED: ${{ secrets.BANYAKTAU_INSTAGRAM_UPLOAD_ENABLED }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
      BANYAKTAU_INSTAGRAM_IG_USER_ID: ${{ secrets.BANYAKTAU_INSTAGRAM_IG_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      BANYAKTAU_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_CONTAINER_POLL_SECONDS: ${{ secrets.INSTAGRAM_CONTAINER_POLL_SECONDS }}
      INSTAGRAM_CONTAINER_MAX_ATTEMPTS: ${{ secrets.INSTAGRAM_CONTAINER_MAX_ATTEMPTS }}

      TIKTOK_UPLOAD_PAUSED: ${{ secrets.TIKTOK_UPLOAD_PAUSED }}
      TIKTOK_UPLOAD_ENABLED: ${{ secrets.TIKTOK_UPLOAD_ENABLED }}
      BANYAKTAU_TIKTOK_UPLOAD_ENABLED: ${{ secrets.BANYAKTAU_TIKTOK_UPLOAD_ENABLED }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
      TIKTOK_SCOPE: ${{ secrets.TIKTOK_SCOPE }}
      TIKTOK_PUBLISH_MODE: ${{ secrets.TIKTOK_PUBLISH_MODE }}
      TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate source
        run: npm run check

      - name: Refresh TikTok token
        if: ${{ env.TIKTOK_UPLOAD_ENABLED == 'true' && env.TIKTOK_REFRESH_TOKEN != '' && env.TIKTOK_UPLOAD_PAUSED != 'true' }}
        run: npm run tiktok:token -- --github-env

      - name: Publish carousel
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_ITEM_ID: ${{ github.event.inputs.item_id }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_REGENERATE: ${{ github.event.inputs.regenerate }}
        run: |
          npm run carousel:publish -- \
            --target "${INPUT_TARGET:-all}" \
            --id "${INPUT_ITEM_ID:-}" \
            --force "${INPUT_FORCE:-false}" \
            --regenerate "${INPUT_REGENERATE:-false}"
