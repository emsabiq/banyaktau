name: BanyakTau Generate Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Optional topic seed
        required: false
        default: ""
      category:
        description: Category
        required: false
        default: random
      duration:
        description: Duration seconds
        required: false
        default: "90"
      scenes:
        description: Scene count
        required: false
        default: "7"
      tts_provider:
        description: openai or elevenlabs
        required: false
        default: openai
      image_quality:
        description: low, medium, high
        required: false
        default: low
      with_clip:
        description: Disabled cost-saver flag. Video AI clips are never generated.
        required: false
        default: "false"
  schedule:
    # GitHub cron uses UTC. Runs at 08:15, 14:15, and 20:15 WIB/Asia-Bangkok.
    - cron: "15 1 * * *"
    - cron: "15 7 * * *"
    - cron: "15 13 * * *"

concurrency:
  group: banyaktau-generate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      UPLOAD_DRIVER: ${{ secrets.UPLOAD_DRIVER || 'auto' }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
      SFTP_UPLOAD_TIMEOUT_SECONDS: ${{ secrets.SFTP_UPLOAD_TIMEOUT_SECONDS || '180' }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      FTP_UPLOAD_TIMEOUT_SECONDS: ${{ secrets.FTP_UPLOAD_TIMEOUT_SECONDS || '180' }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      STORY_MODEL: ${{ secrets.STORY_MODEL || 'gpt-4.1-mini' }}
      IMAGE_MODEL: ${{ secrets.IMAGE_MODEL || 'gpt-image-1-mini' }}
      IMAGE_SIZE: ${{ secrets.IMAGE_SIZE || '1024x1536' }}
      IMAGE_QUALITY: ${{ github.event.inputs.image_quality || secrets.IMAGE_QUALITY || 'low' }}
      OPENAI_TTS_MODEL: ${{ secrets.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts' }}
      OPENAI_TTS_VOICE: ${{ secrets.OPENAI_TTS_VOICE || 'shimmer' }}
      OPENAI_TRANSCRIBE_MODEL: ${{ secrets.OPENAI_TRANSCRIBE_MODEL || 'whisper-1' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL || 'eleven_multilingual_v2' }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

      BANYAKTAU_WITH_CLIP: "false"
      VIDEO_PROVIDER: disabled
      VIDEO_API_KEY: ""
      VIDEO_BASE_URL: ""
      VIDEO_ENDPOINT_MODE: disabled
      VIDEO_MODEL: ""
      VIDEO_SECONDS: "0"
      VIDEO_USD_PER_SECOND: "0"
      GEMINI_API_KEY: ""
      GEMINI_BASE_URL: ""
      SPEECH_TEMPO: ${{ secrets.SPEECH_TEMPO || '1.15' }}
      BANYAKTAU_DAILY_GENERATE_LIMIT: ${{ secrets.BANYAKTAU_DAILY_GENERATE_LIMIT || '3' }}
      BANYAKTAU_PUBLISH_TARGETS: ${{ secrets.BANYAKTAU_PUBLISH_TARGETS || 'auto' }}
      BANYAKTAU_TIME_ZONE: ${{ secrets.BANYAKTAU_TIME_ZONE || 'Asia/Bangkok' }}

      GRAPH_API_VERSION: ${{ secrets.GRAPH_API_VERSION || 'v25.0' }}
      FACEBOOK_UPLOAD_ENABLED: ${{ secrets.FACEBOOK_UPLOAD_ENABLED || secrets.BANYAKTAU_FACEBOOK_UPLOAD_ENABLED || 'false' }}
      FACEBOOK_PAGE_ID: ${{ secrets.BANYAKTAU_FACEBOOK_PAGE_ID || secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_FACEBOOK_PAGE_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_FACEBOOK_USER_ACCESS_TOKEN || secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_MEDIA_TYPE: ${{ secrets.FACEBOOK_MEDIA_TYPE || 'reel' }}
      FACEBOOK_VIDEO_STATE: ${{ secrets.FACEBOOK_VIDEO_STATE || 'PUBLISHED' }}
      FACEBOOK_TITLE_PREFIX: ${{ secrets.FACEBOOK_TITLE_PREFIX }}
      FACEBOOK_REEL_FALLBACK_ENABLED: ${{ secrets.FACEBOOK_REEL_FALLBACK_ENABLED || 'false' }}
      FACEBOOK_STRICT_PUBLISH: ${{ secrets.FACEBOOK_STRICT_PUBLISH || 'false' }}

      INSTAGRAM_UPLOAD_ENABLED: ${{ secrets.INSTAGRAM_UPLOAD_ENABLED || secrets.BANYAKTAU_INSTAGRAM_UPLOAD_ENABLED || 'false' }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.BANYAKTAU_INSTAGRAM_IG_USER_ID || secrets.INSTAGRAM_IG_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.BANYAKTAU_INSTAGRAM_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_SHARE_TO_FEED: ${{ secrets.INSTAGRAM_SHARE_TO_FEED || 'true' }}
      INSTAGRAM_MAX_DURATION_SECONDS: ${{ secrets.INSTAGRAM_MAX_DURATION_SECONDS || '90' }}
      INSTAGRAM_CONTAINER_POLL_SECONDS: ${{ secrets.INSTAGRAM_CONTAINER_POLL_SECONDS || '6' }}
      INSTAGRAM_CONTAINER_MAX_ATTEMPTS: ${{ secrets.INSTAGRAM_CONTAINER_MAX_ATTEMPTS || '90' }}

      YOUTUBE_UPLOAD_ENABLED: ${{ secrets.YOUTUBE_UPLOAD_ENABLED || 'false' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
      YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID || '27' }}
      YOUTUBE_TAGS: ${{ secrets.YOUTUBE_TAGS || 'BanyakTau,Fakta Menarik,Shorts,Pengetahuan,Sains,Sejarah,Teknologi' }}
      YOUTUBE_CUSTOM_THUMBNAIL_ENABLED: ${{ secrets.YOUTUBE_CUSTOM_THUMBNAIL_ENABLED || 'true' }}
      YOUTUBE_THUMBNAIL_UPLOAD_ATTEMPTS: ${{ secrets.YOUTUBE_THUMBNAIL_UPLOAD_ATTEMPTS || '1' }}
      YOUTUBE_DAILY_UPLOAD_LIMIT: ${{ secrets.YOUTUBE_DAILY_UPLOAD_LIMIT || '3' }}

      TIKTOK_UPLOAD_PAUSED: ${{ secrets.TIKTOK_UPLOAD_PAUSED || 'false' }}
      TIKTOK_UPLOAD_ENABLED: ${{ secrets.TIKTOK_UPLOAD_ENABLED || secrets.BANYAKTAU_TIKTOK_UPLOAD_ENABLED || 'false' }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
      TIKTOK_AUTH_SCOPES: ${{ secrets.TIKTOK_AUTH_SCOPES || 'user.info.basic,video.upload,video.publish' }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
      TIKTOK_SCOPE: ${{ secrets.TIKTOK_SCOPE }}
      TIKTOK_PUBLISH_MODE: ${{ secrets.TIKTOK_PUBLISH_MODE || 'direct' }}
      TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
      TIKTOK_DISABLE_DUET: ${{ secrets.TIKTOK_DISABLE_DUET || 'false' }}
      TIKTOK_DISABLE_COMMENT: ${{ secrets.TIKTOK_DISABLE_COMMENT || 'false' }}
      TIKTOK_DISABLE_STITCH: ${{ secrets.TIKTOK_DISABLE_STITCH || 'false' }}
      TIKTOK_COVER_TIMESTAMP_MS: ${{ secrets.TIKTOK_COVER_TIMESTAMP_MS || '1000' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check FFmpeg
        id: ffmpeg
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            ffmpeg -version | head -n 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install FFmpeg
        if: steps.ffmpeg.outputs.ready != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate source
        run: npm run check

      - name: Refresh TikTok token
        if: ${{ env.TIKTOK_UPLOAD_ENABLED == 'true' && env.TIKTOK_REFRESH_TOKEN != '' && env.TIKTOK_UPLOAD_PAUSED != 'true' }}
        run: npm run tiktok:token -- --github-env

      - name: Preflight
        run: npm run preflight

      - name: Generate full video
        run: |
          npm run run:once -- \
            --topic "${{ github.event.inputs.topic }}" \
            --category "${{ github.event.inputs.category }}" \
            --duration "${{ github.event.inputs.duration }}" \
            --scenes "${{ github.event.inputs.scenes }}" \
            --tts-provider "${{ github.event.inputs.tts_provider }}" \
            --image-quality "${{ github.event.inputs.image_quality }}" \
            --with-clip "false"
